server.port=8093
spring.application.name=pagos-service
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8081/realms/banco}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS:http://localhost:8081/realms/banco/protocol/openid-connect/certs}
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
resilience4j.circuitbreaker.instances.cuentasService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.cuentasService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.cuentasService.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.circuitbreaker.instances.pagosService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.pagosService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.pagosService.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

